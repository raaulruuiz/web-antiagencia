name: Ping sitemap a Google Search Console

on:
  push:
    branches: [main]

jobs:
  ping-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar deploy Vercel (60s)
        run: sleep 60

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar googleapis
        run: npm install googleapis

      - name: Enviar sitemap a GSC
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          node -e "
          const { google } = require('googleapis');
          const oauth2 = new google.auth.OAuth2(
            process.env.GOOGLE_CLIENT_ID,
            process.env.GOOGLE_CLIENT_SECRET
          );
          oauth2.setCredentials({ refresh_token: process.env.GOOGLE_REFRESH_TOKEN });
          const sc = google.searchconsole({ version: 'v1', auth: oauth2 });
          const siteUrl = encodeURIComponent('https://antiagencia.es/');
          const feedpath = encodeURIComponent('https://antiagencia.es/sitemap.xml');
          sc.sitemaps.submit({ siteUrl, feedpath })
            .then(() => console.log('✅ Sitemap enviado a GSC'))
            .catch(e => { console.error('❌ Error:', e.message); process.exit(1); });
          "
